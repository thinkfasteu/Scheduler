[build]
  base = "js"          # ← Netlify runs from here
  command = "node tools/build.mjs"   # ← path is now relative to js/
  publish = "."        # ← serve the js/ folder itself (because index.html is here)

[[headers]]
  for = "/dist/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=60"

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
